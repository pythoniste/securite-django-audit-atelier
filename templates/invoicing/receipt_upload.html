{% extends "base.html" %}
{% block title %}Justificatif{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Justificatif — {{ note.label }}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <input type="file" name="receipt" class="form-control mb-2">
  <input type="text" name="name" class="form-control mb-2" placeholder="nom du fichier (optionnel)">
  <button class="btn btn-primary">Téléverser</button>
</form>
{% endblock %}
