# Vhost Apache de démonstration (mod_proxy vers gunicorn).
# À activer : a2enmod proxy proxy_http headers ; a2ensite auditflow
<VirtualHost *:80>
    ServerName auditflow.local

    # En-têtes de sécurité posés AU NIVEAU DU SERVEUR.
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    Alias /static/ /srv/auditflow/staticfiles/
    Alias /media/  /srv/auditflow/media/
    <Directory /srv/auditflow/staticfiles>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /static/ !
    ProxyPass        /media/  !
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    CustomLog ${APACHE_LOG_DIR}/auditflow_access.log combined
</VirtualHost>
